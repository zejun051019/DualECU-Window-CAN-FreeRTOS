name: Host C checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Run 14 project C check groups
        shell: pwsh
        run: ./tools/run-project-host-checks.ps1 -Compiler gcc
