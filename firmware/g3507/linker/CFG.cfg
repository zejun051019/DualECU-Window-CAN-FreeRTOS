source [find interface/xds110.cfg]
transport select swd
source [find target/ti/mspm0.cfg]
# XDS110 reports a 14 MHz maximum on this MSPM0 target.  40 MHz produced a
# Flash FAILVERIFY at address 0 during program/verify, so use the conservative
# 1 MHz SWD rate for reliable VS Code OpenOCD flashing.
adapter speed 1000
